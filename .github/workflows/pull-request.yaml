name: Pull request checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main

jobs:
  semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v2

  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Melos
        run: dart pub global activate melos

      - name: Generate l10n for flutter_deck example
        run: flutter gen-l10n
        working-directory: packages/flutter_deck/example

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Run Melos generate
        run: melos run generate

      - name: Run Melos analyze
        run: melos run analyze

      - name: Check if Melos analyze passes
        run: echo $?

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Melos
        run: dart pub global activate melos

      - name: Melos bootstrap
        run: melos bootstrap

      - name: Run Melos generate
        run: melos run generate

      - name: Run Melos test
        run: melos run test

      - name: Check if Melos test passes
        run: echo $?
